<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随手写 · LYEI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f7f5;
            color: #222;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;
        }

        .container {
            width: min(900px, 92%);
            margin: 0 auto;
            padding: 70px 0 100px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 70px;
        }

        .back {
            color: #222;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .title {
            margin: 0;
            font-size: 42px;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .subtitle {
            margin-top: 10px;
            color: #888;
            font-size: 15px;
        }

        .write-box {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 55px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            resize: vertical;
            border: none;
            outline: none;
            font-size: 16px;
            line-height: 1.8;
            color: #222;
            font-family: inherit;
        }

        textarea::placeholder {
            color: #aaa;
        }

        .write-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .hint {
            color: #aaa;
            font-size: 13px;
        }

        .save-btn {
            border: none;
            background: #222;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .save-btn:hover {
            opacity: 0.8;
        }

        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .entry {
            position: relative;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 18px;
        }

        .time {
            color: #999;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .content {
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.9;
        }

        .delete-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            border: none;
            background: transparent;
            color: #bbb;
            cursor: pointer;
            font-size: 13px;
        }

        .delete-btn:hover {
            color: #555;
        }

        .empty {
            color: #aaa;
            font-size: 14px;
            padding: 20px 0;
        }

        @media (max-width: 600px) {
            .container {
                padding-top: 40px;
            }

            .top {
                margin-bottom: 45px;
            }

            .title {
                font-size: 34px;
            }

            .write-box {
                padding: 18px;
            }

            textarea {
                min-height: 160px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <div>
            <h1 class="title">随手写</h1>
            <div class="subtitle">想到什么，就留下什么。</div>
        </div>

        <a class="back" href="../index.html">← 返回首页</a>
    </div>


    <div class="write-box">

        <textarea
            id="textInput"
            placeholder="写点什么……&#10;&#10;今天发生了什么？&#10;突然想到了什么？&#10;或者只是一些没头没尾的话。"
        ></textarea>

        <div class="write-bottom">
            <span class="hint">保存后会自动记录时间</span>
            <button class="save-btn" onclick="saveEntry()">保存记录</button>
        </div>

    </div>


    <div class="section-title">我的记录</div>

    <div id="entries"></div>

</div>


<script>

    const STORAGE_KEY = "lyei_diary_entries";

    function getEntries() {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    }


    function saveEntries(entries) {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(entries)
        );
    }


    function saveEntry() {

        const input = document.getElementById("textInput");

        const text = input.value.trim();

        if (!text) {
            return;
        }

        const entries = getEntries();

        const entry = {
            id: Date.now(),
            text: text,
            time: new Date().toLocaleString("zh-CN", {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            })
        };

        entries.unshift(entry);

        saveEntries(entries);

        input.value = "";

        renderEntries();
    }


    function deleteEntry(id) {

        const entries = getEntries();

        const newEntries = entries.filter(
            entry => entry.id !== id
        );

        saveEntries(newEntries);

        renderEntries();
    }


    function renderEntries() {

        const container = document.getElementById("entries");

        const entries = getEntries();

        if (entries.length === 0) {

            container.innerHTML =
                '<div class="empty">还没有记录。写下第一句话吧。</div>';

            return;
        }


        container.innerHTML = entries.map(entry => `

            <div class="entry">

                <button
                    class="delete-btn"
                    onclick="deleteEntry(${entry.id})"
                >
                    删除
                </button>

                <div class="time">
                    ${entry.time}
                </div>

                <div class="content">
                    ${escapeHTML(entry.text)}
                </div>

            </div>

        `).join("");
    }


    function escapeHTML(text) {

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    renderEntries();

</script>

</body>
</html>
