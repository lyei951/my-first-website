<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LYEI — A place to keep things.</title>

    <meta name="description" content="A small place for things worth keeping.">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f7f7f5;
            color: #171717;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            width: min(1100px, calc(100% - 48px));
            margin: 0 auto;
            padding: 70px 0 100px;
        }

        /* 顶部 */

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 140px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .header-note {
            font-size: 13px;
            color: #777;
            text-align: right;
            line-height: 1.6;
        }

        /* 主标题 */

        .hero {
            margin-bottom: 120px;
        }

        .hero-small {
            margin-bottom: 18px;
            font-size: 13px;
            color: #888;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hero h1 {
            margin: 0;
            max-width: 850px;
            font-size: clamp(48px, 8vw, 92px);
            line-height: 0.98;
            letter-spacing: -0.065em;
            font-weight: 700;
        }

        /* 两个入口 */

        .sections {
            border-top: 1px solid #d8d8d5;
        }

        .section-link {
            display: grid;
            grid-template-columns: 90px 1fr 40px;
            align-items: center;
            min-height: 180px;
            border-bottom: 1px solid #d8d8d5;
            transition:
                padding 0.25s ease,
                background 0.25s ease;
        }

        .section-link:hover {
            padding-left: 18px;
            background: #eeeeeb;
        }

        .number {
            font-size: 13px;
            color: #888;
            letter-spacing: 0.08em;
        }

        .section-info h2 {
            margin: 0 0 8px;
            font-size: clamp(30px, 4vw, 48px);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        .section-info p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .arrow {
            font-size: 25px;
            color: #777;
            transition: transform 0.25s ease;
        }

        .section-link:hover .arrow {
            transform: translateX(7px);
        }

        /* 底部 */

        footer {
            display: flex;
            justify-content: space-between;
            margin-top: 120px;
            padding-top: 20px;
            border-top: 1px solid #d8d8d5;
            color: #888;
            font-size: 12px;
        }

        /* 手机 */

        @media (max-width: 600px) {

            .page {
                width: min(100% - 32px, 1100px);
                padding-top: 35px;
            }

            header {
                margin-bottom: 100px;
            }

            .hero {
                margin-bottom: 80px;
            }

            .header-note {
                display: none;
            }

            .section-link {
                grid-template-columns: 55px 1fr 25px;
                min-height: 145px;
            }

            .section-info p {
                font-size: 13px;
            }

            footer {
                margin-top: 80px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <div class="logo">
            LYEI
        </div>

        <div class="header-note">
            personal archive<br>
            2026 —
        </div>
    </header>


    <main>

        <section class="hero">

            <div class="hero-small">
                A personal space
            </div>

            <h1>
                A place to<br>
                keep things.
            </h1>

        </section>


        <section class="sections">

            <!-- 001 -->

            <a href="pages/scratchpad.html" class="section-link">

                <div class="number">
                    001
                </div>

                <div class="section-info">

                    <h2>
                        SCRATCHPAD
                    </h2>

                    <p>
                        随手写下想到的东西。
                    </p>

                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <!-- 002 -->

            <a href="pages/photos.html" class="section-link">

                <div class="number">
                    002
                </div>

                <div class="section-info">

                    <h2>
                        PHOTOS
                    </h2>

                    <p>
                        留下一些值得记住的画面。
                    </p>

                </div>

                <div class="arrow">
                    →
                </div>

            </a>

        </section>

    </main>


    <footer>

        <span>
            LYEI
        </span>

        <span>
            A place to keep things.
        </span>

    </footer>

</div>

</body>
</html>
