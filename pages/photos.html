<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photos · LYEI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f7f5;
            color: #222;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;
        }

        .container {
            width: min(1000px, 92%);
            margin: 0 auto;
            padding: 70px 0 100px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 70px;
        }

        .title {
            margin: 0;
            font-size: 46px;
            font-weight: 600;
            letter-spacing: -0.05em;
        }

        .subtitle {
            margin-top: 10px;
            color: #888;
            font-size: 14px;
        }

        .back {
            color: #222;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        /* 上传区域 */

        .upload-box {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            padding: 30px;
            margin-bottom: 70px;
        }

        .upload-title {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .file-input {
            width: 100%;
            padding: 18px;
            border: 1px dashed #ccc;
            border-radius: 10px;
            background: #fafafa;
            cursor: pointer;
        }

        /* 多张图片预览 */

        .preview {
            display: none;
            margin-top: 25px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 8px;
            background: #eee;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-count {
            margin-top: 15px;
            color: #888;
            font-size: 13px;
        }

        .caption-input {
            width: 100%;
            min-height: 90px;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            outline: none;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.7;
        }

        .save-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .save-btn {
            border: none;
            background: #222;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .save-btn:hover {
            opacity: 0.8;
        }

        /* 时间线 */

        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .photo-entry {
            margin-bottom: 70px;
        }

        .photo-time {
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .photo-grid img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            border-radius: 8px;
            background: #eee;
        }

        .photo-caption {
            margin-top: 16px;
            white-space: pre-wrap;
            font-size: 15px;
            line-height: 1.8;
            max-width: 700px;
        }

        .delete-btn {
            margin-top: 12px;
            padding: 0;
            border: none;
            background: none;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            color: #555;
        }

        .empty {
            color: #aaa;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .container {
                padding-top: 40px;
            }

            .top {
                margin-bottom: 45px;
            }

            .title {
                font-size: 36px;
            }

            .upload-box {
                padding: 20px;
            }

            .preview-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">

        <div>
            <h1 class="title">PHOTOS</h1>

            <div class="subtitle">
                一些想留下来的画面。
            </div>
        </div>

        <a class="back" href="../index.html">
            ← 返回首页
        </a>

    </div>


    <!-- 上传 -->

    <div class="upload-box">

        <div class="upload-title">
            留下一些照片
        </div>

        <input
            id="fileInput"
            class="file-input"
            type="file"
            accept="image/*"
            multiple
        >

        <div id="preview" class="preview">

            <div
                id="previewGrid"
                class="preview-grid"
            ></div>

            <div
                id="photoCount"
                class="photo-count"
            ></div>

            <textarea
                id="captionInput"
                class="caption-input"
                placeholder="写点什么……（可以不写）"
            ></textarea>

            <div class="save-row">

                <button
                    class="save-btn"
                    onclick="savePhotos()"
                >
                    保存这些照片
                </button>

            </div>

        </div>

    </div>


    <!-- 照片时间线 -->

    <div class="section-title">
        我的照片
    </div>

    <div id="photos"></div>

</div>


<script>

    const STORAGE_KEY = "lyei_photos";

    let selectedImages = [];


    function getPhotos() {

        return JSON.parse(
            localStorage.getItem(STORAGE_KEY) || "[]"
        );

    }


    function savePhotosToStorage(photos) {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(photos)
        );

    }


    /*
     * 选择一张或多张照片
     */

    document
        .getElementById("fileInput")
        .addEventListener("change", function(event) {

            const files = Array.from(event.target.files);

            if (!files.length) {
                return;
            }

            selectedImages = [];

            const previewGrid =
                document.getElementById("previewGrid");

            previewGrid.innerHTML = "";

            let loaded = 0;


            files.forEach(file => {

                const reader = new FileReader();

                reader.onload = function(e) {

                    selectedImages.push(e.target.result);

                    const item =
                        document.createElement("div");

                    item.className = "preview-item";

                    const img =
                        document.createElement("img");

                    img.src = e.target.result;

                    item.appendChild(img);

                    previewGrid.appendChild(item);


                    loaded++;

                    if (loaded === files.length) {

                        document
                            .getElementById("preview")
                            .style.display = "block";

                        document
                            .getElementById("photoCount")
                            .textContent =
                            `已选择 ${files.length} 张照片`;

                    }

                };

                reader.readAsDataURL(file);

            });

        });


    /*
     * 保存一组照片
     */

    function savePhotos() {

        if (selectedImages.length === 0) {
            return;
        }


        const caption =
            document
                .getElementById("captionInput")
                .value
                .trim();


        const photos =
            getPhotos();


        const photoGroup = {

            id: Date.now(),

            images: selectedImages,

            caption: caption,

            time: new Date().toLocaleString(
                "zh-CN",
                {
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            )

        };


        photos.unshift(photoGroup);

        savePhotosToStorage(photos);


        /* 清空 */

        selectedImages = [];

        document.getElementById("fileInput").value = "";

        document.getElementById("captionInput").value = "";

        document.getElementById("previewGrid").innerHTML = "";

        document.getElementById("photoCount").textContent = "";

        document.getElementById("preview").style.display = "none";


        renderPhotos();

    }


    /*
     * 删除一组照片
     */

    function deletePhotoGroup(id) {

        const photos = getPhotos();

        const newPhotos =
            photos.filter(
                photo => photo.id !== id
            );

        savePhotosToStorage(newPhotos);

        renderPhotos();

    }


    /*
     * 显示照片
     */

    function renderPhotos() {

        const container =
            document.getElementById("photos");

        const photos = getPhotos();


        if (photos.length === 0) {

            container.innerHTML =
                '<div class="empty">还没有照片。</div>';

            return;

        }


        container.innerHTML = photos.map(photo => `

            <div class="photo-entry">

                <div class="photo-time">
                    ${photo.time}
                </div>

                <div class="photo-grid">

                    ${photo.images.map(image => `

                        <img
                            src="${image}"
                            alt="我的照片"
                        >

                    `).join("")}

                </div>


                ${
                    photo.caption
                    ?
                    `<div class="photo-caption">
                        ${escapeHTML(photo.caption)}
                    </div>`
                    :
                    ""
                }


                <button
                    class="delete-btn"
                    onclick="deletePhotoGroup(${photo.id})"
                >
                    删除这一组
                </button>

            </div>

        `).join("");

    }


    function escapeHTML(text) {

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    renderPhotos();

</script>

</body>
</html>
