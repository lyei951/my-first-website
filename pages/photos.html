<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photos · LYEI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.container{width:min(1000px,92%);margin:auto;padding:70px 0 100px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:70px}
h1{margin:0;font-size:46px;font-weight:600;letter-spacing:-.05em}.subtitle{margin-top:10px;color:#888;font-size:14px}.back{color:#222;text-decoration:none;font-size:14px}
.upload-box{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:30px;margin-bottom:70px}.upload-title{font-size:18px;margin-bottom:20px}
#fileInput{display:none}.add-photo-btn{display:flex;justify-content:center;align-items:center;width:100%;min-height:100px;border:1px dashed #ccc;border-radius:10px;background:#fafafa;color:#666;cursor:pointer}
.add-photo-symbol{font-size:24px;margin-right:8px;color:#888}.preview{display:none;margin-top:25px}.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.preview-item{position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;background:#eee}.preview-item img{width:100%;height:100%;object-fit:cover}
.remove-preview{position:absolute;top:7px;right:7px;width:26px;height:26px;border:0;border-radius:50%;background:#000a;color:#fff;cursor:pointer}
.photo-count{margin-top:15px;color:#888;font-size:13px}.add-more-btn{display:inline-block;margin-top:15px;border:1px solid #ddd;background:#fff;color:#555;padding:9px 15px;border-radius:8px;cursor:pointer}
textarea{width:100%;min-height:90px;margin-top:20px;padding:15px;border:1px solid #ddd;border-radius:8px;resize:vertical;font:15px inherit}.save-row{display:flex;justify-content:flex-end;margin-top:15px}
.save-btn{border:0;background:#222;color:#fff;padding:10px 20px;border-radius:8px;cursor:pointer}.save-btn:disabled{opacity:.5}
.section-title{font-size:18px;margin-bottom:30px}.photo-entry{margin-bottom:70px}.photo-time{color:#888;font-size:13px;margin-bottom:15px}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.photo-caption{margin-top:16px;white-space:pre-wrap;font-size:15px;line-height:1.8}.delete-btn{margin-top:12px;border:0;background:none;color:#aaa;cursor:pointer}.empty{color:#aaa;font-size:14px}
@media(max-width:600px){.container{padding-top:40px}.top{margin-bottom:45px}h1{font-size:36px}.upload-box{padding:20px}.preview-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<div class="top"><div><h1>PHOTOS</h1><div class="subtitle">一些想留下来的画面。</div></div><a class="back" href="../index.html">← 返回首页</a></div>
<div class="upload-box">
<div class="upload-title">留下一些照片</div>
<input id="fileInput" type="file" accept="image/*" multiple>
<label for="fileInput" class="add-photo-btn"><span class="add-photo-symbol">＋</span>添加照片</label>
<div id="preview" class="preview">
<div id="previewGrid" class="preview-grid"></div><div id="photoCount" class="photo-count"></div>
<label for="fileInput" class="add-more-btn">＋ 再添加照片</label>
<textarea id="captionInput" placeholder="写点什么……（可以不写）"></textarea>
<div class="save-row"><button id="saveBtn" class="save-btn" onclick="savePhotoGroup()">保存这些照片</button></div>
</div></div>
<div class="section-title">我的照片</div><div id="photos"><div class="empty">正在加载照片……</div></div>
</div>
<script>
const SUPABASE_URL="https://nbboyfmxehuptlxhnhjt.supabase.co";
const SUPABASE_KEY="sb_publishable_Vb8erSWvJdK8SUEYuByxYA_c8DeoC-U";
const BUCKET="photos";let selectedImages=[];
const headers=()=>({apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json"});
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
function time(s){const d=new Date(s);return isNaN(d)?s:d.toLocaleString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}
function ext(f){return f.type.includes("png")?"png":f.type.includes("webp")?"webp":f.type.includes("gif")?"gif":"jpg"}
document.getElementById("fileInput").onchange=async e=>{
 const files=[...e.target.files];e.target.value="";
 for(const file of files){if(!file.type.startsWith("image/"))continue;selectedImages.push({file,url:await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})})}
 renderPreview();
};
function renderPreview(){
 const p=document.getElementById("preview"),g=document.getElementById("previewGrid"),c=document.getElementById("photoCount");
 if(!selectedImages.length){p.style.display="none";g.innerHTML="";c.textContent="";return}
 p.style.display="block";g.innerHTML="";
 selectedImages.forEach((x,i)=>{let d=document.createElement("div");d.className="preview-item";d.innerHTML=`<img src="${x.url}">`;let b=document.createElement("button");b.className="remove-preview";b.textContent="×";b.onclick=()=>{selectedImages.splice(i,1);renderPreview()};d.appendChild(b);g.appendChild(d)});
 c.textContent=`已选择 ${selectedImages.length} 张照片`;
}
async function upload(x,folder,i){
 const name=`${folder}/${Date.now()}-${i}-${Math.random().toString(36).slice(2,7)}.${ext(x.file)}`;
 const r=await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${name}`,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,"Content-Type":x.file.type},body:x.file});
 if(!r.ok)throw Error("图片上传失败："+await r.text());
 return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${name}`;
}
async function savePhotoGroup(){
 if(!selectedImages.length)return alert("请先添加至少一张照片。");
 const b=document.getElementById("saveBtn");b.disabled=true;b.textContent="正在保存……";
 try{
  const folder=`group-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,urls=[];
  for(let i=0;i<selectedImages.length;i++)urls.push(await upload(selectedImages[i],folder,i));
  const r=await fetch(`${SUPABASE_URL}/rest/v1/photos`,{method:"POST",headers:{...headers(),Prefer:"return=representation"},body:JSON.stringify({caption:document.getElementById("captionInput").value.trim(),images:urls})});
  if(!r.ok)throw Error("数据库保存失败："+await r.text());
  selectedImages=[];document.getElementById("captionInput").value="";renderPreview();await renderPhotos();alert("照片保存成功！");
 }catch(e){console.error(e);alert("保存失败：\n\n"+e.message)}finally{b.disabled=false;b.textContent="保存这些照片"}
}
async function getPhotos(){let r=await fetch(`${SUPABASE_URL}/rest/v1/photos?select=*&order=created_at.desc`,{headers:headers()});if(!r.ok)throw Error("读取照片失败："+await r.text());return r.json()}
async function renderPhotos(){
 const box=document.getElementById("photos");
 try{
  const rows=await getPhotos();if(!rows.length){box.innerHTML='<div class="empty">还没有照片。</div>';return}
  box.innerHTML=rows.map(p=>{let imgs=p.images;if(typeof imgs==="string")try{imgs=JSON.parse(imgs)}catch{imgs=[]}if(!Array.isArray(imgs))imgs=[];
   return `<div class="photo-entry"><div class="photo-time">${time(p.created_at)}</div><div class="photo-grid">${imgs.map(u=>`<img src="${esc(u)}" alt="我的照片">`).join("")}</div>${p.caption?`<div class="photo-caption">${esc(p.caption)}</div>`:""}<button class="delete-btn" onclick='deletePhoto(${Number(p.id)},${JSON.stringify(imgs)})'>删除这一组</button></div>`
  }).join("");
 }catch(e){box.innerHTML=`<div class="empty">照片加载失败。<br><br>${esc(e.message)}</div>`}
}
function pathFromUrl(u){const m=`/storage/v1/object/public/${BUCKET}/`;let i=u.indexOf(m);return i<0?null:u.slice(i+m.length)}
async function deletePhoto(id,urls){
 if(!confirm("确定要删除这一组照片吗？"))return;
 try{
  let r=await fetch(`${SUPABASE_URL}/rest/v1/photos?id=eq.${id}`,{method:"DELETE",headers:headers()});
  if(!r.ok)throw Error("删除数据库记录失败："+await r.text());
  const paths=urls.map(pathFromUrl).filter(Boolean);
  if(paths.length)await fetch(`${SUPABASE_URL}/storage/v1/object/remove`,{method:"POST",headers:headers(),body:JSON.stringify({bucketId:BUCKET,prefixes:paths})});
  await renderPhotos();
 }catch(e){alert("删除失败：\n\n"+e.message)}
}
renderPhotos();
</script>
</body>
</html>
