<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photos · LYEI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f7f5;
            color: #222;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;
        }

        .container {
            width: min(1000px, 92%);
            margin: 0 auto;
            padding: 70px 0 100px;
        }

        /* =========================
           顶部
        ========================= */

        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 70px;
        }

        .title {
            margin: 0;
            font-size: 46px;
            font-weight: 600;
            letter-spacing: -0.05em;
        }

        .subtitle {
            margin-top: 10px;
            color: #888;
            font-size: 14px;
        }

        .back {
            color: #222;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        /* =========================
           上传区域
        ========================= */

        .upload-box {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            padding: 30px;
            margin-bottom: 70px;
        }

        .upload-title {
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* 隐藏真正的文件选择器 */

        #fileInput {
            display: none;
        }

        /* 添加照片按钮 */

        .add-photo-btn {
            display: flex;
            justify-content: center;
            align-items: center;

            width: 100%;
            min-height: 100px;

            border: 1px dashed #ccc;
            border-radius: 10px;

            background: #fafafa;

            color: #666;

            cursor: pointer;

            font-size: 14px;

            transition: background 0.2s ease;
        }

        .add-photo-btn:hover {
            background: #f0f0ee;
        }

        .add-photo-symbol {
            font-size: 24px;
            margin-right: 8px;
            color: #888;
        }

        /* =========================
           预览区域
        ========================= */

        .preview {
            display: none;
            margin-top: 25px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 8px;
            background: #eee;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 删除单张待上传照片 */

        .remove-preview {
            position: absolute;

            top: 7px;
            right: 7px;

            width: 26px;
            height: 26px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, 0.65);

            color: #fff;

            cursor: pointer;

            font-size: 15px;

            line-height: 26px;

            padding: 0;
        }

        .remove-preview:hover {
            background: rgba(0, 0, 0, 0.85);
        }

        /* 照片数量 */

        .photo-count {
            margin-top: 15px;
            color: #888;
            font-size: 13px;
        }

        /* 再添加按钮 */

        .add-more-btn {
            margin-top: 15px;

            border: 1px solid #ddd;

            background: #fff;

            color: #555;

            padding: 9px 15px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 13px;
        }

        .add-more-btn:hover {
            background: #f2f2f0;
        }

        /* 文字 */

        .caption-input {
            width: 100%;

            min-height: 90px;

            margin-top: 20px;

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 8px;

            resize: vertical;

            outline: none;

            font-family: inherit;

            font-size: 15px;

            line-height: 1.7;
        }

        .caption-input:focus {
            border-color: #aaa;
        }

        /* 保存 */

        .save-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .save-btn {
            border: none;

            background: #222;

            color: #fff;

            padding: 10px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;
        }

        .save-btn:hover {
            opacity: 0.8;
        }

        /* =========================
           已保存照片
        ========================= */

        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .photo-entry {
            margin-bottom: 70px;
        }

        .photo-time {
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .photo-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 12px;
        }

        .photo-grid img {
            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            display: block;

            border-radius: 8px;

            background: #eee;
        }

        .photo-caption {
            margin-top: 16px;

            white-space: pre-wrap;

            font-size: 15px;

            line-height: 1.8;

            max-width: 700px;
        }

        .delete-btn {
            margin-top: 12px;

            padding: 0;

            border: none;

            background: none;

            color: #aaa;

            cursor: pointer;

            font-size: 12px;
        }

        .delete-btn:hover {
            color: #555;
        }

        .empty {
            color: #aaa;
            font-size: 14px;
        }

        /* =========================
           手机
        ========================= */

        @media (max-width: 600px) {

            .container {
                padding-top: 40px;
            }

            .top {
                margin-bottom: 45px;
            }

            .title {
                font-size: 36px;
            }

            .upload-box {
                padding: 20px;
            }

            .preview-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

        }

    </style>
</head>


<body>

<div class="container">


    <!-- =========================
         顶部
    ========================= -->

    <div class="top">

        <div>

            <h1 class="title">
                PHOTOS
            </h1>

            <div class="subtitle">
                一些想留下来的画面。
            </div>

        </div>


        <a
            class="back"
            href="../index.html"
        >
            ← 返回首页
        </a>

    </div>



    <!-- =========================
         上传区域
    ========================= -->

    <div class="upload-box">


        <div class="upload-title">
            留下一些照片
        </div>


        <!-- 真正的文件选择器 -->

        <input
            id="fileInput"
            type="file"
            accept="image/*"
            multiple
        >


        <!-- 第一次 / 后续添加照片 -->

        <label
            for="fileInput"
            class="add-photo-btn"
        >

            <span class="add-photo-symbol">
                ＋
            </span>

            添加照片

        </label>



        <!-- 预览区域 -->

        <div
            id="preview"
            class="preview"
        >


            <!-- 照片预览 -->

            <div
                id="previewGrid"
                class="preview-grid"
            ></div>


            <!-- 数量 -->

            <div
                id="photoCount"
                class="photo-count"
            ></div>


            <!-- 再添加 -->

            <label
                for="fileInput"
                class="add-more-btn"
            >
                ＋ 再添加照片
            </label>


            <!-- 文字 -->

            <textarea
                id="captionInput"
                class="caption-input"
                placeholder="写点什么……（可以不写）"
            ></textarea>


            <!-- 保存 -->

            <div class="save-row">

                <button
                    class="save-btn"
                    onclick="savePhotoGroup()"
                >
                    保存这些照片
                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         我的照片
    ========================= -->

    <div class="section-title">
        我的照片
    </div>


    <div id="photos"></div>


</div>



<script>

    /* =========================================================
       Supabase 配置
       ========================================================= */

    const SUPABASE_URL = "https://nbboyfmxehuptlxhnhjt.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_Vb8erSWvJdK8SUEYuByxYA_c8DeoC-U";

    const BUCKET_NAME = "photos";


    /* =========================================================
       当前正在准备上传的照片
       ========================================================= */

    let selectedImages = [];


    /* =========================================================
       Supabase 请求头
       ========================================================= */

    function supabaseHeaders() {

        return {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json"
        };

    }


    /* =========================================================
       从 Data URL 转成 Blob
       ========================================================= */

    function dataURLToBlob(dataURL) {

        const parts = dataURL.split(",");

        const mimeMatch =
            parts[0].match(/:(.*?);/);

        const mime =
            mimeMatch
                ? mimeMatch[1]
                : "image/jpeg";

        const binary =
            atob(parts[1]);

        const array =
            new Uint8Array(
                binary.length
            );

        for (
            let i = 0;
            i < binary.length;
            i++
        ) {

            array[i] =
                binary.charCodeAt(i);

        }

        return new Blob(
            [array],
            {
                type: mime
            }
        );

    }


    /* =========================================================
       获取文件扩展名
       ========================================================= */

    function getExtension(dataURL) {

        if (dataURL.includes("image/png")) {
            return "png";
        }

        if (dataURL.includes("image/webp")) {
            return "webp";
        }

        if (dataURL.includes("image/gif")) {
            return "gif";
        }

        if (dataURL.includes("image/heic")) {
            return "heic";
        }

        return "jpg";

    }


    /* =========================================================
       选择照片
       ========================================================= */

    document
        .getElementById("fileInput")
        .addEventListener(
            "change",
            function(event) {

                const files =
                    Array.from(
                        event.target.files
                    );

                if (!files.length) {
                    return;
                }


                let loaded = 0;


                files.forEach(
                    file => {

                        const reader =
                            new FileReader();


                        reader.onload =
                            function(e) {

                                selectedImages.push(
                                    e.target.result
                                );


                                loaded++;


                                if (
                                    loaded ===
                                    files.length
                                ) {

                                    renderPreview();

                                }

                            };


                        reader.readAsDataURL(file);

                    }
                );


                /*
                 * 清空 input
                 *
                 * 这样可以连续选择：
                 *
                 * A
                 * A + B
                 * A + B + C
                 */

                event.target.value = "";

            }
        );


    /* =========================================================
       显示待上传照片
       ========================================================= */

    function renderPreview() {

        const preview =
            document.getElementById(
                "preview"
            );

        const grid =
            document.getElementById(
                "previewGrid"
            );

        const count =
            document.getElementById(
                "photoCount"
            );


        if (
            selectedImages.length === 0
        ) {

            preview.style.display =
                "none";

            grid.innerHTML = "";

            count.textContent = "";

            return;

        }


        preview.style.display =
            "block";


        grid.innerHTML = "";


        selectedImages.forEach(
            (image, index) => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "preview-item";


                const img =
                    document.createElement(
                        "img"
                    );

                img.src = image;

                item.appendChild(img);


                const removeButton =
                    document.createElement(
                        "button"
                    );

                removeButton.className =
                    "remove-preview";

                removeButton.type =
                    "button";

                removeButton.textContent =
                    "×";

                removeButton.title =
                    "移除这张照片";


                removeButton.onclick =
                    function() {

                        removeSelectedImage(
                            index
                        );

                    };


                item.appendChild(
                    removeButton
                );


                grid.appendChild(
                    item
                );

            }
        );


        count.textContent =
            `已选择 ${selectedImages.length} 张照片`;

    }


    /* =========================================================
       删除待上传照片
       ========================================================= */

    function removeSelectedImage(index) {

        selectedImages.splice(
            index,
            1
        );

        renderPreview();

    }


    /* =========================================================
       上传一张照片到 Supabase Storage
       ========================================================= */

    async function uploadImage(
        dataURL,
        groupFolder,
        index
    ) {

        const blob =
            dataURLToBlob(dataURL);

        const extension =
            getExtension(dataURL);


        const fileName =
            `${groupFolder}/${Date.now()}-${index}.${extension}`;


        const uploadURL =
            `${SUPABASE_URL}/storage/v1/object/${BUCKET_NAME}/${fileName}`;


        const response =
            await fetch(
                uploadURL,
                {
                    method: "POST",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`,
                        "Content-Type":
                            blob.type
                    },

                    body: blob
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                `图片上传失败：${errorText}`
            );

        }


        /*
         * Public Bucket 的图片地址
         */

        return (
            `${SUPABASE_URL}` +
            `/storage/v1/object/public/` +
            `${BUCKET_NAME}/${fileName}`
        );

    }


    /* =========================================================
       保存整组照片
       ========================================================= */

    async function savePhotoGroup() {

        if (
            selectedImages.length === 0
        ) {

            alert(
                "请先添加至少一张照片。"
            );

            return;

        }


        const caption =
            document
                .getElementById(
                    "captionInput"
                )
                .value
                .trim();


        const saveButton =
            document.querySelector(
                ".save-btn"
            );


        /*
         * 防止用户连续点击保存
         */

        saveButton.disabled =
            true;

        saveButton.textContent =
            "正在保存……";


        try {

            /*
             * 每一组照片使用一个独立文件夹
             */

            const groupFolder =
                `group-${Date.now()}-${Math.random()
                    .toString(36)
                    .substring(2, 8)}`;


            /*
             * 上传所有照片
             */

            const imageURLs = [];


            for (
                let i = 0;
                i < selectedImages.length;
                i++
            ) {

                const imageURL =
                    await uploadImage(
                        selectedImages[i],
                        groupFolder,
                        i
                    );


                imageURLs.push(
                    imageURL
                );

            }


            /*
             * 把照片地址写入 photos 表
             */

            const insertURL =
                `${SUPABASE_URL}/rest/v1/photos`;


            const response =
                await fetch(
                    insertURL,
                    {
                        method: "POST",

                        headers: {
                            ...supabaseHeaders(),

                            "Prefer":
                                "return=representation"
                        },

                        body: JSON.stringify({
                            caption: caption,
                            images: imageURLs
                        })
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    `数据库保存失败：${errorText}`
                );

            }


            /*
             * 清空当前上传区域
             */

            selectedImages = [];


            document
                .getElementById(
                    "captionInput"
                )
                .value = "";


            document
                .getElementById(
                    "fileInput"
                )
                .value = "";


            renderPreview();


            /*
             * 重新读取照片
             */

            await renderPhotos();


            alert(
                "照片保存成功！"
            );

        }

        catch (error) {

            console.error(
                error
            );

            alert(
                "保存失败：\n\n" +
                error.message
            );

        }

        finally {

            saveButton.disabled =
                false;

            saveButton.textContent =
                "保存这些照片";

        }

    }


    /* =========================================================
       从 Supabase 获取照片
       ========================================================= */

    async function getPhotos() {

        const url =
            `${SUPABASE_URL}` +
            `/rest/v1/photos` +
            `?select=*` +
            `&order=created_at.desc`;


        const response =
            await fetch(
                url,
                {
                    method: "GET",

                    headers:
                        supabaseHeaders()
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                `读取照片失败：${errorText}`
            );

        }


        return await response.json();

    }


    /* =========================================================
       删除照片组
       ========================================================= */

    async function deletePhotoGroup(
        id,
        imageURLs
    ) {

        const confirmDelete =
            confirm(
                "确定要删除这一组照片吗？"
            );


        if (!confirmDelete) {
            return;
        }


        try {

            /*
             * 先从数据库删除记录
             */

            const deleteURL =
                `${SUPABASE_URL}` +
                `/rest/v1/photos` +
                `?id=eq.${id}`;


            const response =
                await fetch(
                    deleteURL,
                    {
                        method: "DELETE",

                        headers:
                            supabaseHeaders()
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    `删除数据库记录失败：${errorText}`
                );

            }


            /*
             * 删除 Storage 里的实际图片
             */

            if (
                imageURLs &&
                imageURLs.length
            ) {

                const paths =
                    imageURLs.map(
                        url => {

                            const marker =
                                `/storage/v1/object/public/${BUCKET_NAME}/`;

                            const position =
                                url.indexOf(
                                    marker
                                );

                            if (
                                position === -1
                            ) {
                                return null;
                            }

                            return url.substring(
                                position +
                                marker.length
                            );

                        }
                    )
                    .filter(
                        path => path
                    );


                if (paths.length) {

                    const removeURL =
                        `${SUPABASE_URL}` +
                        `/storage/v1/object/${BUCKET_NAME}`;


                    const storageResponse =
                        await fetch(
                            removeURL,
                            {
                                method: "DELETE",

                                headers: {
                                    ...supabaseHeaders(),

                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        prefixes: paths
                                    })
                            }
                        );


                    /*
                     * Storage 删除失败时，
                     * 不影响数据库已经删除。
                     */

                    if (
                        !storageResponse.ok
                    ) {

                        console.warn(
                            "Storage 图片删除失败"
                        );

                    }

                }

            }


            await renderPhotos();

        }

        catch (error) {

            console.error(
                error
            );

            alert(
                "删除失败：\n\n" +
                error.message
            );

        }

    }


    /* =========================================================
       显示已经保存的照片
       ========================================================= */

    async function renderPhotos() {

        const container =
            document.getElementById(
                "photos"
            );


        container.innerHTML =
            '<div class="empty">正在加载照片……</div>';


        try {

            const photos =
                await getPhotos();


            if (
                photos.length === 0
            ) {

                container.innerHTML =
                    '<div class="empty">还没有照片。</div>';

                return;

            }


            container.innerHTML =
                photos
                    .map(
                        photo => {

                            /*
                             * images 是 jsonb
                             */

                            let images =
                                photo.images;


                            /*
                             * 如果数据库返回的是字符串，
                             * 尝试转换成数组。
                             */

                            if (
                                typeof images ===
                                "string"
                            ) {

                                try {

                                    images =
                                        JSON.parse(
                                            images
                                        );

                                }

                                catch {

                                    images = [];

                                }

                            }


                            if (
                                !Array.isArray(
                                    images
                                )
                            ) {

                                images = [];

                            }


                            return `

                                <div
                                    class="photo-entry"
                                >

                                    <div
                                        class="photo-time"
                                    >
                                        ${formatTime(
                                            photo.created_at
                                        )}
                                    </div>


                                    <div
                                        class="photo-grid"
                                    >

                                        ${images
                                            .map(
                                                image => `

                                                    <img
                                                        src="${escapeHTML(
                                                            image
                                                        )}"
                                                        alt="我的照片"
                                                    >

                                                `
                                            )
                                            .join("")
                                        }

                                    </div>


                                    ${
                                        photo.caption
                                        ?
                                        `
                                        <div
                                            class="photo-caption"
                                        >
                                            ${escapeHTML(
                                                photo.caption
                                            )}
                                        </div>
                                        `
                                        :
                                        ""
                                    }


                                    <button
                                        class="delete-btn"
                                        onclick='deletePhotoGroup(
                                            ${photo.id},
                                            ${JSON.stringify(
                                                images
                                            ).replace(
                                                /'/g,
                                                "&#039;"
                                            )}
                                        )'
                                    >
                                        删除这一组
                                    </button>

                                </div>

                            `;

                        }
                    )
                    .join("");

        }

        catch (error) {

            console.error(
                error
            );

            container.innerHTML =
                `
                <div class="empty">
                    照片加载失败。
                    <br><br>
                    ${escapeHTML(
                        error.message
                    )}
                </div>
                `;

        }

    }


    /* =========================================================
       时间格式
       ========================================================= */

    function formatTime(
        timestamp
    ) {

        if (!timestamp) {
            return "";
        }


        const date =
            new Date(timestamp);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return timestamp;

        }


        return date.toLocaleString(
            "zh-CN",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }
